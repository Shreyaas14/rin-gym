[project]
name = "rin-gym"
version = "0.1.0"
description = "Sports forecasting pipelines and a soccer trading RL environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jinja2==3.1.6",
    "pyarrow>=20,<26",
]

[project.optional-dependencies]
train = [
    "tinker-cookbook==0.5.7",
    "tinker==0.33.1",
    "chz==0.4.0",
    "torch==2.14.1",
    "transformers==5.5.4",
    "tokenizers==0.22.2",
    "numpy==2.5.4",
]
replay = ["numpy", "Pillow"]

[tool.uv]
package = false
