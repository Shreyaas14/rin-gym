name: Tests and installed tool
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install dependencies
        run: |
          if [ -f pyproject.toml ]; then
            uv sync --frozen
          else
            uv venv
            uv pip install 'numpy>=2,<3' 'pyarrow>=20,<26' 'Pillow>=10.1,<13' 'duckdb>=1.3,<2' tzdata pytz
          fi
      - name: Run regression suites
        run: .venv/bin/python scripts/check_tests.py
      - name: Build distributions
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: uv build
      - name: Install wheel as a uv tool outside checkout
        if: ${{ hashFiles('pyproject.toml') != '' }}
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/rin-gym-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/rin-gym-bin
          RIN_GYM_WORKSPACE: ${{ runner.temp }}/rin-gym-workspace
        run: |
          uv tool install --python '${{ matrix.python }}' dist/*.whl
          cd '${{ runner.temp }}'
          '${{ runner.temp }}/rin-gym-bin/rin-gym' --help
          '${{ runner.temp }}/rin-gym-tools/rin-gym/bin/python' '${{ github.workspace }}/scripts/check_tests.py' --installed
  optional-evaluation-integrations:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install locked optional evaluation SDKs
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: uv sync --frozen --all-extras
      - name: Run native SDK and local MLflow integration tests
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: .venv/bin/python scripts/check_tests.py
